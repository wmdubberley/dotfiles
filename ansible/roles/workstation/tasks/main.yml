---
# ── Desktop APT packages ──────────────────────────────────────────────────────
- name: Install workstation apt packages
  become: true
  ansible.builtin.apt:
    name:
      - gimp
      - libreoffice
      - audacity
      - hplip
      - mysql-shell
      - cava
      - maven
      - libpq-dev
    state: present
    update_cache: true

# ── .NET SDK ──────────────────────────────────────────────────────────────────
- name: Add Microsoft .NET package feed
  become: true
  ansible.builtin.shell: |
    wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb \
      -O /tmp/packages-microsoft-prod.deb
    dpkg -i /tmp/packages-microsoft-prod.deb
    rm /tmp/packages-microsoft-prod.deb
    apt-get update
  args:
    creates: /etc/apt/sources.list.d/microsoft-prod.list

- name: Install dotnet-sdk-8.0
  become: true
  ansible.builtin.apt:
    name: dotnet-sdk-8.0
    state: present

# ── Docker ────────────────────────────────────────────────────────────────────
- name: Install Docker Engine
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    groups: docker
    append: true

# ── minikube ──────────────────────────────────────────────────────────────────
- name: Install minikube
  become: true
  ansible.builtin.shell: |
    curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
    install minikube-linux-amd64 /usr/local/bin/minikube
    rm minikube-linux-amd64
  args:
    creates: /usr/local/bin/minikube

# ── Google Chrome ─────────────────────────────────────────────────────────────
- name: Install Google Chrome
  become: true
  ansible.builtin.shell: |
    wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
      -O /tmp/chrome.deb
    apt-get install -y /tmp/chrome.deb
    rm /tmp/chrome.deb
  args:
    creates: /usr/bin/google-chrome

# ── draw.io ───────────────────────────────────────────────────────────────────
- name: Install draw.io desktop
  become: true
  ansible.builtin.shell: |
    LATEST=$(curl -s https://api.github.com/repos/jgraph/drawio-desktop/releases/latest \
      | grep browser_download_url | grep amd64.deb | cut -d '"' -f 4)
    wget -q "$LATEST" -O /tmp/drawio.deb
    apt-get install -y /tmp/drawio.deb
    rm /tmp/drawio.deb
  args:
    creates: /usr/bin/drawio

# ── Removed tools cleanup ─────────────────────────────────────────────────────
- name: Remove Azure CLI
  become: true
  ansible.builtin.apt:
    name: azure-cli
    state: absent

- name: Remove MongoDB CLI
  become: true
  ansible.builtin.apt:
    name: mongodb-mongocli
    state: absent

- name: Remove dbt via pipx
  ansible.builtin.shell: pipx uninstall dbt-core
  args:
    removes: "{{ ansible_facts['env']['HOME'] }}/.local/bin/dbt"

- name: Remove Snowflake CLI via pipx
  ansible.builtin.shell: pipx uninstall snowflake-cli
  args:
    removes: "{{ ansible_facts['env']['HOME'] }}/.local/bin/snow"

- name: Remove Liquibase directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/Programs/liquidbase"
    state: absent

- name: Remove Calibre
  become: true
  ansible.builtin.shell: calibre-uninstall --yes
  args:
    removes: /usr/bin/calibre

# ── SQLcl ─────────────────────────────────────────────────────────────────────
- name: Install SQLcl
  ansible.builtin.shell: |
    wget -q https://download.oracle.com/otn_software/java/sqldeveloper/sqlcl-latest.zip \
      -O /tmp/sqlcl.zip
    unzip -q /tmp/sqlcl.zip -d {{ ansible_facts['env']['HOME'] }}
    rm /tmp/sqlcl.zip
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/sqlcl/bin/sql"

