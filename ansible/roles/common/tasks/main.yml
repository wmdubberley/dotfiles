---
# ── EPEL (RedHat/Oracle only) ─────────────────────────────────────────────────
- name: Enable EPEL repository
  become: true
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_os_family == "RedHat"

# ── APT packages (Debian/Ubuntu) ──────────────────────────────────────────────
- name: Install base packages (Debian)
  become: true
  ansible.builtin.apt:
    name:
      - zsh
      - git
      - gpg
      - pass
      - curl
      - wget
      - unzip
      - build-essential
      - python3
      - python3-pip
      - python3-venv
      - python3-full
      - pipx
      - btop
      - htop
      - eza
      - tree
      - jq
      - xclip
      - net-tools
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - bc
      - default-jdk
      - terminator
      - tmux
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# ── DNF packages (RedHat/Oracle Linux) ───────────────────────────────────────
- name: Install base packages (RedHat)
  become: true
  ansible.builtin.dnf:
    name:
      - zsh
      - git
      - gnupg2
      - pass
      - curl
      - wget
      - unzip
      - gcc
      - gcc-c++
      - make
      - python3
      - python3-pip
      - btop
      - htop
      - tree
      - jq
      - xclip
      - net-tools
      - ca-certificates
      - bc
      - java-latest-openjdk
      - terminator
      - tmux
    state: present
  when: ansible_os_family == "RedHat"

- name: Install pipx (RedHat)
  become: true
  ansible.builtin.pip:
    name: pipx
    executable: pip3
  when: ansible_os_family == "RedHat"

- name: Install eza (RedHat)
  become: true
  ansible.builtin.shell: |
    curl -Lo /tmp/eza.tar.gz \
      "https://github.com/eza-community/eza/releases/latest/download/eza_x86_64-unknown-linux-gnu.tar.gz"
    tar -xzf /tmp/eza.tar.gz -C /usr/local/bin eza
    chmod +x /usr/local/bin/eza
  args:
    creates: /usr/local/bin/eza
  when: ansible_os_family == "RedHat"

# ── VSCode (Debian) ───────────────────────────────────────────────────────────
- name: Add Microsoft GPG key (Debian)
  become: true
  ansible.builtin.shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc \
      | gpg --dearmor > /usr/share/keyrings/microsoft.gpg
  args:
    creates: /usr/share/keyrings/microsoft.gpg
  when: ansible_os_family == "Debian"

- name: Add VSCode apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
    state: present
    filename: vscode
  when: ansible_os_family == "Debian"

- name: Install VSCode (Debian)
  become: true
  ansible.builtin.apt:
    name: code
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# ── VSCode (RedHat/Oracle Linux) ──────────────────────────────────────────────
- name: Add VSCode RPM repository
  become: true
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: https://packages.microsoft.com/yumrepos/vscode
    gpgkey: https://packages.microsoft.com/keys/microsoft.asc
    gpgcheck: true
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install VSCode (RedHat)
  become: true
  ansible.builtin.dnf:
    name: code
    state: present
  when: ansible_os_family == "RedHat"

# ── VSCode extensions (all platforms) ────────────────────────────────────────
- name: Install VSCode extensions
  ansible.builtin.shell: code --install-extension {{ item }} --force
  loop:
    - ms-python.python
    - donjayamanne.python-extension-pack
    - ms-vscode-remote.remote-ssh
    - ms-vscode-remote.remote-containers
    - ms-vscode.remote-explorer
    - ms-kubernetes-tools.vscode-kubernetes-tools
    - ms-azuretools.vscode-containers
    - redhat.vscode-yaml
    - anthropic.claude-code
    - atlassian.atlascode
    - oracle.sql-developer
    - mtxr.sqltools
    - hediet.vscode-drawio
    - janisdd.vscode-edit-csv
    - mechatroner.rainbow-csv
    - phplasma.csv-to-table
    - ms-vscode.makefile-tools
    - ms-vscode.powershell
    - github.copilot
    - tomoki1207.pdf
  ignore_errors: true

# ── oh-my-zsh ─────────────────────────────────────────────────────────────────
- name: Install oh-my-zsh
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"

- name: Set zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    shell: /usr/bin/zsh

# ── nvm + Node ────────────────────────────────────────────────────────────────
- name: Install nvm
  ansible.builtin.shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.nvm/nvm.sh"

- name: Install Node LTS via nvm
  ansible.builtin.shell: |
    export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
    source "$NVM_DIR/nvm.sh"
    nvm install --lts
    nvm use --lts
    nvm alias default node
  args:
    executable: /bin/bash

# ── Claude Code ───────────────────────────────────────────────────────────────
- name: Install Claude Code (npm global)
  ansible.builtin.shell: |
    export NVM_DIR="{{ ansible_facts['env']['HOME'] }}/.nvm"
    source "$NVM_DIR/nvm.sh"
    npm install -g @anthropic-ai/claude-code
  args:
    executable: /bin/bash

# ── chezmoi ───────────────────────────────────────────────────────────────────
- name: Install chezmoi
  ansible.builtin.shell: |
    sh -c "$(curl -fsLS get.chezmoi.io)" -- -b {{ ansible_facts['env']['HOME'] }}/.local/bin
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi"

# ── OCI CLI ───────────────────────────────────────────────────────────────────
- name: Install OCI CLI via pipx
  ansible.builtin.shell: |
    pipx install oci-cli
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.local/bin/oci"

# ── kubectl (Debian) ──────────────────────────────────────────────────────────
- name: Add Kubernetes apt keyring
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key \
      | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: ansible_os_family == "Debian"

- name: Add Kubernetes apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
    state: present
    filename: kubernetes
  when: ansible_os_family == "Debian"

- name: Install kubectl (Debian)
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# ── kubectl (RedHat/Oracle Linux) ─────────────────────────────────────────────
- name: Add Kubernetes RPM repository
  become: true
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    baseurl: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/
    gpgkey: https://pkgs.k8s.io/core:/stable:/v1.30/rpm/repodata/repomd.xml.key
    gpgcheck: true
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install kubectl (RedHat)
  become: true
  ansible.builtin.dnf:
    name: kubectl
    state: present
  when: ansible_os_family == "RedHat"

# ── Ansible (ensure latest via pipx) ─────────────────────────────────────────
- name: Ensure Ansible is installed via pipx
  ansible.builtin.shell: |
    pipx install ansible --include-deps 2>/dev/null || pipx upgrade ansible
  changed_when: false
