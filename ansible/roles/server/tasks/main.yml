---
# ── Docker Engine ─────────────────────────────────────────────────────────────
- name: Install Docker Engine (Debian)
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker
  when: ansible_os_family == "Debian"

- name: Add Docker CE RPM repository (RedHat)
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"
  when: ansible_os_family == "RedHat"

- name: Install Docker Engine (RedHat)
  become: true
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: ansible_os_family == "RedHat"

- name: Enable and start Docker (RedHat)
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  when: ansible_os_family == "RedHat"

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    groups: docker
    append: true

# ── k3s ───────────────────────────────────────────────────────────────────────
- name: Install k3s
  become: true
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Create .kube directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.kube"
    state: directory
    mode: "0700"

- name: Copy k3s kubeconfig for user
  become: true
  ansible.builtin.shell: |
    cp /etc/rancher/k3s/k3s.yaml {{ ansible_facts['env']['HOME'] }}/.kube/config
    chown {{ ansible_facts['env']['USER'] }}:{{ ansible_facts['env']['USER'] }} {{ ansible_facts['env']['HOME'] }}/.kube/config
    chmod 600 {{ ansible_facts['env']['HOME'] }}/.kube/config
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.kube/config"

# ── Helm ──────────────────────────────────────────────────────────────────────
- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  become: true

# ── Portainer ─────────────────────────────────────────────────────────────────
- name: Create Portainer data volume
  become: true
  ansible.builtin.shell: |
    docker volume create portainer_data
  changed_when: false

- name: Run Portainer CE container
  become: true
  ansible.builtin.shell: |
    docker run -d \
      --name portainer \
      --restart=always \
      -p 9000:9000 \
      -p 9443:9443 \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -v portainer_data:/data \
      portainer/portainer-ce:latest
  args:
    creates: /var/lib/docker/volumes/portainer_data

# ── External drive mount points ───────────────────────────────────────────────
- name: Create sambashare group
  become: true
  ansible.builtin.group:
    name: sambashare
    state: present

- name: Remove stale empty mount point directories
  become: true
  ansible.builtin.shell: |
    find /media/{{ ansible_facts['env']['USER'] }} -mindepth 1 -maxdepth 1 -type d -empty -exec rmdir {} +
  changed_when: false
  failed_when: false

- name: Gather unmounted partitions from lsblk
  ansible.builtin.shell: |
    lsblk -o NAME,FSTYPE,LABEL,MOUNTPOINT --pairs | python3 -c "
    import sys, re
    skip = {'swap', 'LVM2_member', ''}
    for line in sys.stdin:
        f = dict(re.findall(r'(\w+)=\"([^\"]*)\"', line))
        name = f.get('NAME', '')
        fstype = f.get('FSTYPE', '')
        label = f.get('LABEL', '')
        mp = f.get('MOUNTPOINT', '')
        if fstype not in skip and not mp and not re.match(r'^(loop|sr|dm-)', name):
            lbl = re.sub(r'[^a-zA-Z0-9._-]', '_', label or name)
            print(f'{name},{fstype},{lbl}')
    "
  register: lsblk_output
  changed_when: false

- name: Set unmounted drives fact
  ansible.builtin.set_fact:
    unmounted_drives: "{{ lsblk_output.stdout_lines | map('split', ',') | list }}"

- name: Create mount point directories
  become: true
  ansible.builtin.file:
    path: "/media/{{ ansible_facts['env']['USER'] }}/{{ item[2] }}"
    state: directory
    mode: "0775"
    group: sambashare
  loop: "{{ unmounted_drives }}"

- name: Mount NTFS drives
  become: true
  ansible.builtin.command:
    cmd: "mount -t ntfs-3g /dev/{{ item[0] }} /media/{{ ansible_facts['env']['USER'] }}/{{ item[2] }}"
  loop: "{{ unmounted_drives }}"
  when: item[1] in ['ntfs', 'ntfs-3g']
  changed_when: true

- name: Mount other drives
  become: true
  ansible.builtin.command:
    cmd: "mount /dev/{{ item[0] }} /media/{{ ansible_facts['env']['USER'] }}/{{ item[2] }}"
  loop: "{{ unmounted_drives }}"
  when: item[1] not in ['ntfs', 'ntfs-3g']
  changed_when: true

# ── Samba ─────────────────────────────────────────────────────────────────────
- name: Install Samba
  become: true
  ansible.builtin.dnf:
    name:
      - samba
      - samba-common
    state: present

- name: Deploy smb.conf
  become: true
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    mode: "0644"
  notify: Restart Samba

- name: Enable and start Samba services (Debian)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smbd
    - nmbd
  when: ansible_os_family == "Debian"

- name: Enable and start Samba services (RedHat)
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smb
    - nmb
  when: ansible_os_family == "RedHat"

- name: Open Samba ports in firewalld
  become: true
  ansible.posix.firewalld:
    service: samba
    permanent: true
    state: enabled
    immediate: true
  ignore_errors: true
