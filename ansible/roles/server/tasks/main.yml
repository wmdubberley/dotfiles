---
# ── Docker Engine ─────────────────────────────────────────────────────────────
- name: Install Docker Engine
  become: true
  ansible.builtin.shell: |
    curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['env']['USER'] }}"
    groups: docker
    append: true

# ── Server Python tools ───────────────────────────────────────────────────────
- name: Install server Python packages via pipx
  ansible.builtin.shell: |
    pipx install oci-cli 2>/dev/null || true
    pipx install dbt-core 2>/dev/null || true
    pipx inject dbt-core dbt-oracle 2>/dev/null || true
  changed_when: false
